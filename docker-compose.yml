services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  web:
    build: .
    env_file: settings/.env
    volumes:
      - sqlite_db:/app/db
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      - redis
    command:
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "8000"
      - settings.asgi:application
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    depends_on:
      - web
  celery_worker:
    build: .
    env_file: settings/.env
    depends_on:
      - redis
    command: celery -A settings worker -l info
  celery_beat:
    build: .
    env_file: settings/.env
    depends_on:
      - redis
    command: celery -A settings beat -l info
  flower:
    build: .
    ports:
      - "5555:5555"
    env_file: settings/.env
    depends_on:
      - redis
    command: >
      celery -A settings flower --basic-auth=$BLOG_FLOWER_USER:$BLOG_FLOWER_PASSWORD

volumes:
  sqlite_db:
  static:
  media: